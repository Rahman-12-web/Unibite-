<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4A1942">
<meta name="description" content="UniBite: food and cakes from campus vendors, for University of Ilesha students only.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js">
<title>UniBite · Good Food. Right Around Campus.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"></noscript>
<style>
:root{--plum:#4A1942;--coral:#F26B5B;--gold:#F4C95D;--ivory:#FFF9F3;--ink:#211F23;--mute:#6f6873;--line:#eadfd6;--card:#fff;--ok:#2f8f5b;
--r:12px;--sh:0 1px 2px rgba(74,25,66,.06),0 4px 14px rgba(74,25,66,.06);--nav:64px}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:70px}
body{font:400 15px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:var(--ivory);padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
h1,h2,h3,.brand{font-family:'Plus Jakarta Sans',Inter,sans-serif;color:var(--plum);line-height:1.2}
h1{font-size:clamp(1.7rem,6vw,2.6rem);font-weight:800}
h2{font-size:1.2rem;font-weight:700}h3{font-size:1rem;font-weight:700}
a{color:inherit;text-decoration:none}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--plum);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-size:1.35rem;font-weight:800;color:#fff}.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--ivory);flex:none}.logo img{width:auto;height:30px}.brand b{color:var(--gold)}
.cartbtn{position:relative;display:grid;place-items:center;width:40px;height:40px;color:#fff}
.hbtns{display:flex;gap:4px;align-items:center}.loginbtn{display:inline-flex;align-items:center;height:34px;padding:0 14px;margin-right:4px;border-radius:99px;background:var(--gold);color:var(--plum);font:600 .85rem Inter}[hidden]{display:none!important}#cartCount,#bellCount{position:absolute;top:0;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--coral);font:600 11px/18px Inter;text-align:center}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line)}
nav#nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--mute)}
nav#nav a[aria-current=page]{color:var(--plum);font-weight:600}
nav#nav a[aria-current=page] svg{stroke:var(--coral)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{max-width:1080px;margin:0 auto;padding:16px;outline:0}
section{margin-top:28px}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.row a{color:var(--coral);font-weight:600;font-size:.9rem}
.mute{color:var(--mute);font-size:.88rem}
.hero{background:var(--plum);color:#fff;border-radius:var(--r);padding:24px 20px;position:relative;overflow:hidden}
.hero h1{color:#fff}.hero p{margin:10px 0 18px;max-width:46ch;color:#e9d9e6}
.hero-logo{display:block;width:76px;padding:8px 10px;margin-bottom:16px;background:var(--ivory);border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.search{display:flex;gap:8px;position:relative;z-index:1;max-width:460px}
.search input{flex:1;min-width:0}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--plum);outline:2px solid rgba(74,25,66,.15)}
label{display:block;font-weight:500;font-size:.88rem;margin:12px 0 4px}
.err{color:#b3261e;font-size:.82rem;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--plum);color:#fff;font:600 .95rem Inter;cursor:pointer;transition:background .15s}
.btn:hover{background:#611f57}.btn.coral{background:var(--coral)}.btn.coral:hover{background:#e25a49}
.btn.ghost{background:transparent;color:var(--plum);border:1px solid var(--plum)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85rem}.btn.block{width:100%}
.btn[disabled]{background:#d9d2d6;color:#8d868b;cursor:not-allowed}
.split{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.cat{display:block;padding:18px 16px;border-radius:var(--r);min-height:110px;box-shadow:var(--sh)}
.cat.food{background:var(--coral);color:#fff}.cat.food h3{color:#fff}
.cat.cakes{background:var(--gold)}.cat.cakes h3{color:var(--plum)}
.cat p{font-size:.85rem;margin-top:4px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;position:relative}
.card .body{padding:12px 14px 14px}
.ph{aspect-ratio:16/9;background:repeating-linear-gradient(45deg,#f3ebe4,#f3ebe4 10px,#efe5dd 10px,#efe5dd 20px);display:grid;place-items:center;color:var(--mute);font-size:.78rem}
.ph img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:600;background:var(--gold);color:var(--plum)}
.badge.food{background:#fde3df;color:#a63a2c}.badge.off{background:#eee;color:var(--mute)}
.fav{position:absolute;top:8px;right:8px;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:50%;background:#fff;cursor:pointer;color:var(--mute)}
.fav.on{color:var(--coral)}.fav.on svg{fill:var(--coral)}
.prod{display:flex;gap:12px;padding:12px;align-items:center}
.prod .ph{width:84px;aspect-ratio:1;border-radius:10px;flex:none;overflow:hidden}
.prod .info{flex:1;min-width:0}.prod .info p{font-size:.82rem;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price{font-weight:700;color:var(--plum)}
.qty{display:inline-flex;align-items:center;gap:10px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:1.1rem;cursor:pointer}
.tabs{display:flex;gap:6px;background:#f3ebe4;padding:4px;border-radius:10px;margin-bottom:14px}
.tabs button{flex:1;min-height:38px;border:0;border-radius:8px;background:transparent;font:600 .9rem Inter;color:var(--mute);cursor:pointer}
.tabs button[aria-selected=true]{background:#fff;color:var(--plum);box-shadow:var(--sh)}
.steps{list-style:none;padding:0;margin:12px 0 0}
.steps li{position:relative;padding:0 0 12px 30px;color:var(--mute);font-size:.9rem}
.steps li:before{content:"";position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:#fff}
.steps li:after{content:"";position:absolute;left:8px;top:22px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child:after{display:none}
.steps li.done{color:var(--ink)}.steps li.done:before{background:var(--ok);border-color:var(--ok);content:"✓";color:#fff;font-size:11px;text-align:center;line-height:14px}
.steps li.now{color:var(--plum);font-weight:600}.steps li.now:before{border-color:var(--coral);background:var(--coral);box-shadow:0 0 0 4px rgba(242,107,91,.2)}
.line{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.total{border-top:1px dashed var(--line);margin-top:8px;padding-top:10px;font-weight:700;font-size:1.05rem}
.pay{background:#fff6e0;border:1px solid var(--gold);border-radius:var(--r);padding:14px;margin-top:14px}
.pay dt{font-size:.78rem;color:var(--mute)}.pay dd{font-weight:600;margin-bottom:8px;word-break:break-all}
.empty{text-align:center;padding:40px 16px}.empty h3{margin:10px 0 4px}.empty .btn{margin-top:14px}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,#f3ebe4,#faf5f0,#f3ebe4);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
dialog{border:0;border-radius:var(--r);padding:20px;max-width:min(92vw,380px);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(33,31,35,.5)}
dialog .btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:40;transition:.2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
.narrow{max-width:520px;margin:0 auto}.vgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.vgrid .body{padding:10px}.vgrid h3{font-size:.95rem;overflow-wrap:anywhere}.vgrid .mute{font-size:.8rem;overflow-wrap:anywhere}.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sw{width:52px;height:30px;border-radius:99px;border:0;background:#d9d2d6;position:relative;cursor:pointer;flex:none;transition:background .15s}.sw span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:var(--ok)}.sw.on span{left:25px}
.chk{display:flex;align-items:center;gap:8px;margin:0;font-weight:500}input[type=checkbox]{width:20px;height:20px;padding:0;flex:none;accent-color:var(--plum)}
.hrow{display:grid;grid-template-columns:62px minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center;margin-bottom:8px}.hrow input[type=time]{padding:8px 6px;min-width:0}
.permbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--gold);color:var(--plum);padding:10px 16px;font-size:.85rem;font-weight:500}.permbar span{flex:1;min-width:180px}
.alarmbar{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 12px + env(safe-area-inset-bottom));z-index:35;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:var(--coral);color:#fff;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3)}.alarmbar span{display:flex;align-items:center;gap:8px}.alarmbar .btn{background:#fff;color:var(--plum)}@media(min-width:900px){.alarmbar{bottom:24px;left:auto;max-width:380px}}
.care{position:fixed;right:14px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:6px;height:46px;padding:0 16px;border-radius:99px;background:#128C4A;color:#fff;font:600 .9rem Inter,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.25)}.care .ic{width:22px;height:22px;stroke:#fff}body.ringing .care{display:none}@media(min-width:900px){.care{bottom:24px;right:24px}}
.uni{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--gold);color:var(--plum);font-weight:600;font-size:.8rem}.foot{max-width:1080px;margin:0 auto;padding:6px 16px 30px;text-align:center;font-size:.78rem;color:var(--mute)}.foot a{color:var(--coral);font-weight:600}.terms h2{margin:18px 0 6px}.terms p,.terms li{margin:4px 0;color:var(--ink)}.terms ul{padding-left:20px}
.cp{display:flex;align-items:center;gap:8px}.copy{display:inline-grid;place-items:center;width:34px;height:34px;flex:none;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--plum);cursor:pointer}.copy .ic{width:18px;height:18px}.pay .btn .ic{width:18px;height:18px}
.low{color:var(--coral);font-size:.8rem;font-weight:600}.tabs.five button{font-size:.78rem;padding:0 2px}
.pick{display:grid;gap:6px}.pick-item{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:500 .92rem Inter,sans-serif;color:var(--ink);text-align:left;cursor:pointer}
.pick-item .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none;color:#fff}
.pick-item.next:hover{border-color:var(--plum)}.pick-item.done{color:var(--mute);background:#f7f2ec;cursor:default}.pick-item.done .dot{background:var(--ok);border-color:var(--ok)}
.pick-item.now{border-color:var(--coral);background:#fff1ef;color:var(--ink);font-weight:600;cursor:default}.pick-item.now .dot{background:var(--coral);border-color:var(--coral)}
.rev{background:var(--plum);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:12px}.rev p{color:#e9d9e6;font-size:.85rem}.rev h2{color:#fff;font-size:1.9rem;font-weight:800;margin:2px 0}
.revrow{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;font-size:.8rem;color:#e9d9e6}.revrow b{display:block;color:var(--gold);font-size:1rem}@media(min-width:900px){.vgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.stars-in{display:flex;gap:2px;margin:4px 0 10px}.stars-in button{background:none;border:0;padding:0 2px;font-size:2rem;line-height:1;color:#d9d2d6;cursor:pointer}.stars-in button.on{color:#e0a800}
@media(min-width:900px){
 body{padding-bottom:0}
 .top{gap:24px}.brand{order:0}
 nav#nav{position:static;height:auto;padding:0;background:none;border:0;flex:1;justify-content:center;gap:4px}
 nav#nav a{flex:none;flex-direction:row;gap:6px;padding:8px 14px;border-radius:8px;color:#e9d9e6;font-size:.9rem}
 nav#nav a[aria-current=page]{background:rgba(255,255,255,.12);color:#fff}
 nav#nav a[aria-current=page] svg{stroke:var(--gold)}
 #toast{bottom:24px}
 .hero{padding:44px 40px;min-height:300px}.hero>*:not(.hero-logo){max-width:58%}.hero-logo{position:absolute;right:48px;top:50%;transform:translateY(-50%);width:200px;padding:18px 22px;margin:0;border-radius:28px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
